# Fixture: green-enabled.yaml with community, issue_capture, labels and trust
# deleted and listed in not_applicable, their jobs disabled, jobs that need no
# marked block (scoreboard-refresh, fleet-heartbeat) enabled, security_contact
# filled. alarms_to is blank on purpose, to prove security_contact alone
# satisfies not_applicable_divert. Must stay green.
project:
  name: "fixture project"
  trunk_branch: "main"
  release_model:
    style: "tag-per-release"
    changelog_file: "CHANGELOG.md"
    shipped_means: "tag-exists-and-deployed"

repositories:
  - host: "github.com"
    owner: "example"
    name: "app"
    role: "primary"
    visibility: "private"
    host_closes_on_merge: false

scope:
  anchors:
    - "serves the product"
  philosophy_veto:
    - "scope creep"
  bypass_scope_gate:
    - "bug-fix-on-shipped-feature"
    - "security-fix"
    - "reliability-fix"



security:
  security_contact: "github-advisory"
  security_sensitive_surfaces: ["auth"]

ci_and_gates:
  test_command: "bundle exec rspec"
  test_runtime_estimate: "4 min"
  ci_present: true
  code_review_tool: ""
  adversarial_review_tool: ""
  visual_preview_tool: ""
  ui_viewports: []

autonomy:
  pr_labeling: "B"
  issue_triage_replies: "B"
  issue_autoclose: "C"
  announcements: "C"
  pr_merge: "B"
  human_reachable_at: "#steward-ops"



secrets:
  credentials_file: "/srv/steward/.env"
  execute_contributor_code: false
  sandbox_available: false

scheduled_jobs:
  jobs:
    - { name: "issue-capture",   every: "1h", enabled: false,  agent: true  }
    - { name: "action-watchdog", every: "6h", enabled: true,  agent: false }
    - { name: "announcements",   every: "8h", enabled: true,  agent: false }
    - { name: "label-sync",      every: "4h", enabled: false,  agent: false }
    - { name: "issue-autoclose", every: "4h", enabled: true,  agent: false }
    - { name: "scoreboard-refresh", every: "2h", enabled: true, agent: false }
    - { name: "fleet-heartbeat", cron: "30 8 * * *", enabled: true, agent: false }
  outputs:
    index_path: "/srv/steward/index.md"
    digest_to: ""
    alarms_to: ""

not_applicable:
  - "community"
  - "issue_capture"
  - "labels"
  - "trust"

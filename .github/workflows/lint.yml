name: Lint

# On a pull request this gates the merge. On push to main, pages.yml calls
# this workflow and deploys only if it passes.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A literal group name: in a called workflow, github.workflow is the caller's.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true  # Ruby comes from .ruby-version
      # Each step is a bin/ci step, so `bin/ci contracts` runs the same thing locally.
      - name: Unit tests
        run: bin/ci unit
      - name: Skills-contract lint
        run: bin/ci skills
      - name: Config-contract lint
        run: bin/ci config
      - name: Anchor-link lint
        run: bin/ci anchor

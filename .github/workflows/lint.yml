name: Lint

# On a pull request this gates the merge. On push to main, pages.yml calls
# this workflow and deploys only if it passes.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A literal group name: in a called workflow, github.workflow is the caller's.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Unit tests
        run: |
          shopt -s nullglob
          files=(test/*_test.rb)
          if [ ${#files[@]} -eq 0 ]; then echo "no test files found"; exit 1; fi
          for f in "${files[@]}"; do echo "== $f"; bundle exec ruby "$f" || exit 1; done
        shell: bash
      - name: Skills-contract lint
        run: bundle exec ./bin/skills-contract-lint
      - name: Config-contract lint
        run: bundle exec ./bin/config-lint
      - name: Anchor-link lint
        run: bundle exec ./bin/anchor-lint

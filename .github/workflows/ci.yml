name: CI

# Build the docs site and verify internal links/anchors before merge.
# pages.yml deploys on push-to-main; this gates the pull request beforehand
# so a broken build or dead link can't merge with zero signal.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Build with an empty baseurl so links are root-relative and resolve
      # under _site/ (production uses baseurl: /steward-os, which html-proofer
      # would otherwise chase to non-existent paths).
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
      - name: Check internal links and anchors
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --allow-hash-href

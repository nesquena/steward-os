name: CI

# Build the docs site and verify internal links/anchors before merge.
# On a pull request this gates the merge. On push to main, pages.yml calls
# this workflow and deploys only if it passes, so a broken build or dead link
# never reaches the published site.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A literal group name: in a called workflow, github.workflow is the caller's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Build with an empty baseurl so links are root-relative and resolve
      # under _site/ (production uses baseurl: /steward-os, which html-proofer
      # would otherwise chase to non-existent paths).
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
      - name: Check internal links and anchors
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --allow-hash-href

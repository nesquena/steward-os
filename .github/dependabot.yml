version: 2
updates:
  # Workflow actions are pinned to commit SHAs with a version comment;
  # Dependabot bumps both. Version updates come as one grouped PR a week, with
  # at most two open; security updates are separate and not limited by this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # Gemfile.lock pins the gems CI installs. Bumps come grouped, weekly.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      gems:
        patterns: ["*"]
    open-pull-requests-limit: 2
